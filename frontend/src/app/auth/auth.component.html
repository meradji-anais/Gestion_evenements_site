<div class="auth-container">
  <div class="auth-card">
    <h2> Authentification</h2>

    <!-- TABS -->
    <div class="tabs">
      <button 
        [class.active]="activeTab === 'login'" 
        (click)="switchTab('login')"
        class="tab-btn">
        Connexion
      </button>
      <button 
        [class.active]="activeTab === 'register'" 
        (click)="switchTab('register')"
        class="tab-btn">
        Inscription
      </button>
    </div>

    <!-- ERROR MESSAGE -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- LOGIN FORM -->
    <form *ngIf="activeTab === 'login'" (ngSubmit)="login()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="loginEmail" 
          name="loginEmail" 
          placeholder="votre@email.com"
          required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="loginPassword" 
          name="loginPassword" 
          placeholder="••••••"
          required>
      </div>

      <button type="submit" class="primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form *ngIf="activeTab === 'register'" (ngSubmit)="register()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="registerEmail" 
          name="registerEmail" 
          placeholder="votre@email.com"
          required>
      </div>

      <div class="form-group">
        <label>Mot de passe (min. 6 caractères)</label>
        <input 
          type="password" 
          [(ngModel)]="registerPassword" 
          name="registerPassword" 
          placeholder="••••••"
          required>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="registerConfirmPassword" 
          name="registerConfirmPassword" 
          placeholder="••••••"
          required>
      </div>

      <div class="form-group">
        <label>Je suis...</label>
        <select [(ngModel)]="registerRole" name="registerRole">
          <option value="PARTICIPANT">Participant</option>
          <option value="ORGANIZER"> Organisateur</option>
        </select>
      </div>

      <button type="submit" class="primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Inscription...' : 'Créer mon compte' }}
      </button>
    </form>

    <!-- COMPTES DE TEST -->
    <div class="test-accounts">
      <p style="font-size: 0.85em; color: #666; margin-top: 1rem;">
        <strong>Comptes de test :</strong><br>
        Organisateur : admin@eventwhere.com / admin123<br>
        Participant : meradji@mail.com / meradji123
      </p>
    </div>
  </div>
</div>

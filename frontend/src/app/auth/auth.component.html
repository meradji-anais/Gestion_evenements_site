<div class="auth-container">
  <div class="auth-card">
    <h2> Authentification</h2>

    <!-- TABS -->
    <div class="tabs">
      <button 
        [class.active]="activeTab === 'login'" 
        (click)="switchTab('login')"
        class="tab-btn">
        Connexion
      </button>
      <button 
        [class.active]="activeTab === 'register'" 
        (click)="switchTab('register')"
        class="tab-btn">
        Inscription
      </button>
    </div>

    <!-- ERROR MESSAGE -->
    <div *ngIf="errorMessage" class="error-message">
       {{ errorMessage }}
    </div>

    <!-- SUCCESS MESSAGE -->
    <div *ngIf="successMessage" class="success-message">
       {{ successMessage }}
    </div>

    <!-- LOGIN FORM -->
    <form *ngIf="activeTab === 'login'" (ngSubmit)="login()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="loginEmail" 
          name="loginEmail" 
          placeholder="votre@email.com"
          required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="loginPassword" 
          name="loginPassword" 
          placeholder="••••••"
          required>
      </div>

      <button type="submit" class="primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Connexion...' : 'Se connecter' }}
      </button>

      <!--  MOT DE PASSE OUBLIÉ -->
      <div class="forgot-password">
        <a (click)="switchTab('reset')" class="forgot-link">
          Mot de passe oublié ?
        </a>
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form *ngIf="activeTab === 'register'" (ngSubmit)="register()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="registerEmail" 
          name="registerEmail" 
          placeholder="votre@email.com"
          required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="registerPassword" 
          name="registerPassword" 
          placeholder="••••••"
          required>
        <small class="password-hint">
          • Minimum 6 caractères<br>
          • Au moins 1 lettre et 1 chiffre
        </small>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="registerConfirmPassword" 
          name="registerConfirmPassword" 
          placeholder="••••••"
          required>
      </div>

      <div class="form-group">
        <label>Je suis...</label>
        <select [(ngModel)]="registerRole" name="registerRole">
          <option value="PARTICIPANT"> Participant</option>
          <option value="ORGANIZER"> Organisateur</option>
        </select>
      </div>

      <button type="submit" class="primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Inscription...' : 'Créer mon compte' }}
      </button>
    </form>

    <!--  RESET PASSWORD FORM -->
    <form *ngIf="activeTab === 'reset'" (ngSubmit)="resetPassword()" class="auth-form">
      <p class="reset-info">
        Entrez votre email et votre nouveau mot de passe pour réinitialiser votre compte.
      </p>

      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="resetEmail" 
          name="resetEmail" 
          placeholder="votre@email.com"
          required>
      </div>

      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="resetNewPassword" 
          name="resetNewPassword" 
          placeholder="••••••"
          required>
        <small class="password-hint">
          • Minimum 6 caractères<br>
          • Au moins 1 lettre et 1 chiffre
        </small>
      </div>

      <div class="form-group">
        <label>Confirmer le nouveau mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="resetConfirmPassword" 
          name="resetConfirmPassword" 
          placeholder="••••••"
          required>
      </div>

      <button type="submit" class="primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
      </button>

      <div class="back-to-login">
        <a (click)="switchTab('login')" class="back-link">
          ← Retour à la connexion
        </a>
      </div>
    </form>
  </div>
</div>

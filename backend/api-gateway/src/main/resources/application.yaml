spring:
  application:
    name: api-gateway

  cloud:
    compatibility-verifier:
      enabled: false

    gateway:
      routes:
        # AJOUTE CETTE ROUTE EN PREMIER (pour les fichiers statiques)
        - id: uploads-static
          uri: http://localhost:9091
          predicates:
            - Path=/uploads/**
        
        # Routes existantes
        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/api/events/**

        - id: participant-service
          uri: lb://PARTICIPANT-SERVICE
          predicates:
            - Path=/api/participants/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:4200
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

server:
  port: 9090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
spring:
  application:
    name: authentification-service
  
  datasource:
    url: jdbc:h2:file:./data/authdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  
  session:
    store-type: none

server:
  port: 9094
  
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false
        same-site: lax
        path: /
        max-age: 1800

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.eventwhere.auth: DEBUG
    org.springframework.web: DEBUG
    org.springframework.session: DEBUG

spring:
  application:
    name: authentification-service
  
  datasource:
    url: jdbc:h2:file:./data/authdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Configuration JWT
eventwhere:
  app:
    jwtSecret: VotreSecretSuperSecurise123456789012345678901234567890
    jwtExpirationMs: 86400000  # 24 heures

server:
  port: 9094

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.eventwhere.auth: DEBUG
    org.springframework.security: DEBUG
